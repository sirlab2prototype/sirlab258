/**:
  ros__parameters:
    # Multiple RealSense nodes share the USB bus. Resetting during startup
    # can disconnect the sibling camera and cause both streams to flap.
    initial_reset: false
    enable_color: true
    enable_depth: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    rgb_camera.color_profile: 640x480x30
    pointcloud.enable: false
    align_depth.enable: false
    rgb_camera.enable_auto_exposure: false
    rgb_camera.exposure: 50
    rgb_camera.gain: 16
    rgb_camera.enable_auto_white_balance: false
    rgb_camera.white_balance: 4600.0
